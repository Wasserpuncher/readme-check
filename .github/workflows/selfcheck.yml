name: selfcheck
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Prove the action installs and runs on a deterministic fixture
        uses: ./
        with:
          path: .github/action-selfcheck/README.md
