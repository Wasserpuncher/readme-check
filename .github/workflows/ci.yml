name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Test
        run: python -m pytest -q

      # The tool is run against its own README. If this file ever claims
      # something readme-check cannot do, the build fails -- which is a
      # particularly embarrassing way to find out, and exactly the point.
      - name: Check our own README
        run: python -m readmecheck README.md --no-color
